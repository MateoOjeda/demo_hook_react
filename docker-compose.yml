services:
  postgres:
    image: postgres:16
    container_name: task_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: task_backend
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: task_manager
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
    container_name: task_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: